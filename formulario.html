<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">GOGGINS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="historia.html">História</a></li>
                    <li class="nav-item"><a class="nav-link" href="midias.html">Mídias</a></li>
                    <li class="nav-item"><a class="nav-link" href="formulario.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1>Contato</h1>
        <div class="row mt-4">
            <div class="col-lg-5">
                <p>Se quiser saber mais sobre o tema, pode mandar uma mensagem.</p>
                <p><strong>Email:</strong> contato@goggins.com</p>
            </div>
            <div class="col-lg-7">
                <form class="card p-3">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Digite seu email">
                    </div>
                    <div class="mb-3">
                        <label for="idade" class="form-label">Idade</label>
                        <input type="number" class="form-control" id="idade" placeholder="Digite sua idade">
                    </div>
                    <div class="mb-3">
                        <label for="interesse" class="form-label">Interesse</label>
                        <select class="form-select" id="interesse">
                            <option>Selecione</option>
                            <option>Treinamento</option>
                            <option>Motivação</option>
                            <option>Disciplina</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning">Enviar</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer text-center py-3">
        <p class="mb-0">Entre em contato</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
